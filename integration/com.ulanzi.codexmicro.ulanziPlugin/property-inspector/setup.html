<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Bridge Setup</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; background: transparent; color: #e8e8e8; font-size: 13px; }
    * { box-sizing: border-box; }
    main { padding: 12px 14px 10px; }
    h1 { margin: 0 0 5px; font-size: 15px; }
    .intro, .message, .info-body { color: #aeb3ba; line-height: 1.4; }
    .intro { margin: 0 0 10px; }
    .panel, details { border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: rgba(255,255,255,.035); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .row:last-child { border-bottom: 0; }
    .value { display: inline-flex; align-items: center; gap: 6px; text-align: right; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #72777f; }
    .good { color: #75d6a3; } .good .dot { background: #42c985; }
    .warn { color: #f0bc68; } .warn .dot { background: #e6a84b; }
    .bad, .error { color: #ef8585; } .bad .dot { background: #e45f5f; }
    .success { color: #75d6a3; }
    .message { min-height: 18px; margin: 8px 1px 4px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    button { min-height: 33px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; color: #f3f3f3; background: rgba(255,255,255,.08); cursor: pointer; }
    button.primary { background: #2867ad; } button.danger { grid-column: 1 / -1; color: #ef9a9a; }
    button:disabled { opacity: .45; cursor: default; }
    .setting { margin-top: 10px; padding: 9px 10px; }
    .setting label { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start; cursor: pointer; }
    .setting input { margin-top: 3px; }
    .setting strong, .setting small { display: block; }
    .setting small { margin-top: 3px; color: #aeb3ba; line-height: 1.35; }
    .model-setting label { display: block; margin: 8px 0 4px; }
    .model-setting input, .model-setting select { width: 100%; padding: 6px; color: inherit; background: #25272b; border: 1px solid #60656d; border-radius: 4px; }
    .model-setting :disabled { opacity: .45; }
    details { margin-top: 10px; } summary { padding: 9px 10px; cursor: pointer; font-weight: 600; }
    .info-body { padding: 0 10px 10px; }
    .info-body code { display: block; margin: 7px 0; padding: 7px 8px; border-radius: 5px; background: rgba(0,0,0,.28); user-select: text; }
    .version { margin-top: 7px; color: #777e87; font-size: 11px; text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="intro" class="intro"></p>
    <section id="modelSettings" class="panel setting model-setting" hidden>
      <strong id="modelSettingsTitle"></strong>
      <label id="presetLabel" for="presetOption"></label>
      <select id="presetOption" disabled>
        <option id="presetCustom" value="">Default / Custom</option>
        <option value="gpt-6-astra:low">gpt-6-astra (low)</option>
        <option value="gpt-6-astra:medium">gpt-6-astra (medium)</option>
        <option value="gemini-3.8-flash-high:medium">gemini-3.8-flash (medium)</option>
        <option value="gpt-5.6-sol:high">gpt-5.6-sol (high)</option>
      </select>
      <small id="presetHelp"></small>
      <label id="modelLabel" for="model"></label>
      <input id="model" type="text" list="modelSuggestions" maxlength="100" autocomplete="off" spellcheck="false" aria-describedby="modelHelp modelError" disabled>
      <datalist id="modelSuggestions">
        <option value="gpt-6-astra"></option><option value="GPT-6 Astra"></option>
        <option value="gemini-3.8-flash"></option><option value="gemini-3.8-flash-high"></option>
        <option value="gpt-5.6-sol"></option><option value="5.6 Sol"></option>
        <option value="5.6 Luna"></option><option value="gpt-5.6-luna"></option>
      </datalist>
      <small id="modelHelp"></small>
      <label id="effortLabel" for="effort"></label>
      <select id="effort" aria-describedby="effortHelp modelError" disabled>
        <option id="effortDefault" value=""></option>
        <option value="none">none</option><option value="minimal">minimal</option>
        <option value="low">low</option><option value="medium">medium</option>
        <option value="high">high</option><option value="xhigh">xhigh</option>
        <option value="max">max</option><option value="ultra">ultra</option>
      </select>
      <small id="effortHelp"></small>
      <small id="modelDefaults"></small>
      <div id="modelError" class="message error" role="status" aria-live="polite"></div>
    </section>
    <section class="panel">
      <div class="row"><span id="appLabel"></span><span id="appValue" class="value"><i class="dot"></i><span></span></span></div>
      <div class="row"><span id="serviceLabel"></span><span id="serviceValue" class="value"><i class="dot"></i><span></span></span></div>
      <div class="row"><span id="cdpLabel"></span><span id="cdpValue" class="value"><i class="dot"></i><span></span></span></div>
    </section>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="install" class="primary">Install / Repair</button>
      <button id="launch"></button>
      <button id="refresh"></button>
      <button id="guide"></button>
      <button id="uninstall" class="danger"></button>
    </div>
    <section class="panel setting">
      <label>
        <input id="forceFocus" type="checkbox">
        <span><strong id="forceFocusLabel"></strong><small id="forceFocusDescription"></small></span>
      </label>
    </section>
    <details>
      <summary id="bridgeAppInfoTitle"></summary>
      <div class="info-body">
        <p id="bridgeAppDescription"></p>
        <code>--remote-debugging-address=127.0.0.1<br>--remote-debugging-port=9222<br>--remote-allow-origins=http://127.0.0.1:9222</code>
        <p id="bridgeAppSafety"></p>
      </div>
    </details>
    <details>
      <summary id="backgroundTitle"></summary>
      <div class="info-body">
        <p id="launchAgentDescription"></p>
        <p id="nodeSelectionStrategy"></p>
        <p id="ulanziNodeSignatureNotice"></p>
        <p id="currentNodeRuntime"></p>
      </div>
    </details>
    <div id="version" class="version"></div>
  </main>
  <script>
    const t = {
      modelSettingsTitle:"Model shortcut (this key)",
      presetLabel:"Default options", presetHelp:"Select a default model preset or enter custom settings below.",
      presetCustom:"Default / Custom",
      modelLabel:"Model", effortLabel:"Reasoning effort",
      modelHelp:"Enter the exact model name shown in the Codex menu, or a known official ID alias. Custom display names are supported. Leave blank for this key's default. Changes save automatically.",
      effortHelp:"Choose only an effort actually available for this model in Codex. Unsupported choices fail without fallback. Blank uses this key's default effort.",
      effortDefault:"Default", modelDefaults:"Defaults: {model} ({id}) / {effort}",
      modelInvalid:"Use at most 100 characters: letters, numbers, spaces or . _ + ( ) / : -. Control characters and code/HTML punctuation are not allowed.",
      effortInvalid:"Choose a listed reasoning effort.", modelLoading:"Restoring this key's settings…",
      title:"Codex Bridge Setup", intro:"Install, launch, and check the local Codex connection.",
      app:"Codex Bridge", service:"Bridge service", cdp:"CDP connection", checking:"Checking…",
      installed:"Installed", update:"Update available", notInstalled:"Not installed", online:"Online",
      offline:"Offline", connected:"Connected", disconnected:"Disconnected", install:"Install / Repair",
      installing:"Installing…", launch:"Launch Codex Bridge", launching:"Launching…", uninstall:"Uninstall Codex Bridge",
      uninstalling:"Uninstalling…", refresh:"Check again", guide:"Installation guide", ready:"Codex Micro is ready.",
      needInstall:"Install Codex Bridge to continue.", needLaunch:"Start Codex through Codex Bridge.",
      serviceOffline:"The Bridge service is offline. Use Install / Repair.", installDone:"Codex Bridge was installed.",
      launchDone:"Launch requested. Waiting for CDP…", uninstallDone:"Codex Bridge was uninstalled.",
      failed:"Operation failed", unsupported:"Automatic installation is available on Windows and macOS only.",
      confirm:"Install or repair Codex Bridge? Windows requests administrator approval only when protected Bridge code is installed or updated; normal starts stay silent.",
      uninstallConfirm:"Uninstall Codex Bridge and its scheduled task? Windows will request administrator approval. Codex Desktop and the Ulanzi plugin are kept.",
      bridgeAppInfoTitle:"How does Codex Bridge start Codex?",
      bridgeAppDescription:"Windows dynamically discovers Codex Stable or Beta. macOS uses the local wrapper. Both launch the official executable with loopback-only CDP arguments.",
      bridgeAppSafety:"The launcher does not modify accounts, projects, or user files. Bridge write actions require a local capability token.",
      backgroundTitle:"Background activity and Node.js",
      launchAgentDescription:"Windows uses a current-user, on-demand highest-privilege task; normal starts are silent. macOS uses a user LaunchAgent.",
      nodeSelectionStrategy:"Install / Repair selects Node.js 20+ from PATH, then uses Ulanzi Studio Node as a fallback.",
      ulanziNodeSignatureNotice:"Windows runs only hash-verified protected Bridge code. The task never stores the local capability token.",
      currentNode:"Current runtime: {runtime} {version}", systemNode:"System Node.js",
      ulanziNode:"Ulanzi Studio Node", unknownNode:"Not installed or not recorded", version:"Installed {installed} · Bundled {bundled}",
      forceFocus:"Force focus (Windows)",
      forceFocusDescription:"Windows access-denied focus failures already receive one automatic protected Alt fallback. Enable this to use the same fallback for other focus denials. No idle hooks, polling, or helper process is added."
    };
    const query = new URLSearchParams(location.search);
    const rawLanguage = query.get("language") || "en-US";
    const locale = /^zh[-_](HK|TW)/i.test(rawLanguage) ? "zh_HK" : rawLanguage.startsWith("zh") ? "zh_CN" : rawLanguage.split(/[-_]/)[0];
    const resource = { en:"en", zh_CN:"zh_CN", zh_HK:"zh_HK", ja:"ja_JP", de:"de_DE", ko:"ko_KR", pt:"pt_PT", es:"es_ES" }[locale] || "en";
    const connection = { address:query.get("address") || "127.0.0.1", port:query.get("port") || "3906", uuid:query.get("uuid") || "com.ulanzi.ulanzistudio.codexmicro.task1", actionid:query.get("actionid") || "", key:query.get("key") || "" };
    let socket; let busy = false; let pollTimer;
    const modelPresets = {
      "com.ulanzi.ulanzistudio.codexmicro.model-sol-high": { model:"gpt-5.6-sol", label:"5.6 Sol", effort:"high" },
      "com.ulanzi.ulanzistudio.codexmicro.model-luna-max": { model:"gpt-5.6-luna", label:"5.6 Luna", effort:"max" },
      "com.ulanzi.ulanzistudio.codexmicro.model-sol-medium": { model:"gpt-5.6-sol", label:"5.6 Sol", effort:"medium" }
    };
    const modelPreset = modelPresets[connection.uuid];
    const efforts = ["", "none", "minimal", "low", "medium", "high", "xhigh", "max", "ultra"];
    const defaultModelPresets = [
      { id:"gpt-6-astra:low", model:"gpt-6-astra", effort:"low" },
      { id:"gpt-6-astra:medium", model:"gpt-6-astra", effort:"medium" },
      { id:"gemini-3.8-flash-high:medium", model:"gemini-3.8-flash-high", effort:"medium" },
      { id:"gpt-5.6-sol:high", model:"gpt-5.6-sol", effort:"high" }
    ];
    let actionSettings = {}; let settingsReady = false;

    function isFlashModel(modelName) {
      const key = String(modelName || "").trim().toLowerCase().replace(/[- ]/g, "");
      return key === "gemini3.8flash" || key === "gemini3.8flashhigh";
    }
    function isSingleEffortModel(modelName) {
      const name = String(modelName || "").trim().toLowerCase();
      return !isFlashModel(name) && (name.includes("gemini") || name.includes("flash-high"));
    }
    function updateEffortState() {
      const model = document.getElementById("model");
      const effort = document.getElementById("effort");
      if (!model || !effort) return;
      text("effortDefault", `${t.effortDefault} (${isFlashModel(model.value) ? "medium" : modelPreset.effort})`);
      if (isSingleEffortModel(model.value)) {
        effort.value = "high";
        effort.disabled = true;
      } else if (settingsReady) {
        effort.disabled = false;
      }
    }
    function syncPresetOption(m, eff) {
      const preset = document.getElementById("presetOption");
      if (!preset) return;
      const modelVal = String(m ?? "").trim().toLowerCase();
      const effortVal = String(eff ?? "").trim().toLowerCase();
      const match = defaultModelPresets.find(p => {
        const pModel = p.model.toLowerCase();
        const pAlias = pModel.replace(/^gpt[- ]/, "").replace(/[- ]/g, "");
        const normalized = modelVal.replace(/^gpt[- ]/, "").replace(/[- ]/g, "");
        const matchesModel = modelVal === pModel || normalized === pAlias
          || (isFlashModel(modelVal) && isFlashModel(pModel));
        return matchesModel && effortVal === p.effort;
      });
      preset.value = match ? match.id : "";
    }

    async function loadLocalizedResources() {
      try {
        const localized = (await (await fetch(`../${resource}.json`)).json()).Localization || {};
        const fields = { BridgeSetup:"title", BridgeSetupDescription:"intro", BridgeApp:"app", BridgeService:"service", CDPConnection:"cdp", InstallRepair:"install", LaunchBridge:"launch", UninstallBridge:"uninstall", UninstallingBridge:"uninstalling", UninstallBridgeDone:"uninstallDone", UninstallBridgeConfirm:"uninstallConfirm", BridgeAppInfoTitle:"bridgeAppInfoTitle", BridgeAppDescription:"bridgeAppDescription", BridgeAppSafety:"bridgeAppSafety", BackgroundActivityTitle:"backgroundTitle", LaunchAgentDescription:"launchAgentDescription", NodeSelectionStrategy:"nodeSelectionStrategy", UlanziNodeSignatureNotice:"ulanziNodeSignatureNotice", CurrentNodeRuntime:"currentNode", SystemNode:"systemNode", UlanziNode:"ulanziNode", UnknownNode:"unknownNode", CheckAgain:"refresh", InstallationGuide:"guide", ForceFocus:"forceFocus", ForceFocusDescription:"forceFocusDescription" };
        for (const [source, target] of Object.entries(fields)) if (localized[source]) t[target] = localized[source];
        for (const key of ["modelSettingsTitle", "modelLabel", "effortLabel", "modelHelp", "effortHelp", "effortDefault", "modelDefaults", "modelInvalid", "effortInvalid", "modelLoading", "presetLabel", "presetHelp", "presetCustom"]) {
          const value = localized[key[0].toUpperCase() + key.slice(1)];
          if (typeof value === "string" && value) t[key] = value;
        }
      } catch {}
    }
    function text(id, value) { document.getElementById(id).textContent = value; }
    function format(template, values) { return template.replace(/\{(\w+)\}/g, (_, key) => values[key] || "—"); }
    function setValue(id, value, level = "") { const element = document.getElementById(id); element.className = `value ${level}`; element.querySelector("span").textContent = value; }
    function send(action) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ cmd:"sendToPlugin", uuid:connection.uuid, actionid:connection.actionid, key:connection.key, payload:{ type:"bridgeSetup", action } })); }
    function sendGlobalSettings(cmd, settings) {
      if (socket?.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        cmd,
        uuid:connection.uuid,
        actionid:connection.actionid,
        key:connection.key,
        ...(settings ? { settings } : {})
      }));
    }
    function render(status, payload = {}) {
      busy = Boolean(payload.busy);
      setValue("appValue", status.installed ? (status.needsUpdate ? t.update : t.installed) : t.notInstalled, status.installed ? (status.needsUpdate ? "warn" : "good") : "bad");
      setValue("serviceValue", status.serviceOnline ? t.online : t.offline, status.serviceOnline ? "good" : "bad");
      setValue("cdpValue", status.cdpConnected ? t.connected : t.disconnected, status.cdpConnected ? "good" : "warn");
      const install = document.getElementById("install"); const launch = document.getElementById("launch"); const uninstall = document.getElementById("uninstall");
      install.textContent = busy && payload.operation === "install" ? t.installing : t.install;
      launch.textContent = busy && payload.operation === "launch" ? t.launching : t.launch;
      uninstall.textContent = busy && payload.operation === "uninstall" ? t.uninstalling : t.uninstall;
      install.disabled = busy || !status.supported; launch.disabled = busy || !status.installed || status.cdpConnected; uninstall.disabled = busy || !status.supported || !status.installed;
      let message = !status.supported ? t.unsupported : !status.installed || status.needsUpdate ? t.needInstall : !status.serviceOnline ? t.serviceOffline : !status.cdpConnected ? t.needLaunch : t.ready;
      let level = status.cdpConnected && status.installed && !status.needsUpdate ? "success" : "";
      if (payload.result === "install") { message = t.installDone; level = "success"; }
      if (payload.result === "launch") { message = t.launchDone; level = "success"; }
      if (payload.result === "uninstall") { message = t.uninstallDone; level = "success"; }
      if (payload.error) { message = `${t.failed}: ${payload.error}`; level = "error"; }
      text("message", message); document.getElementById("message").className = `message ${level}`;
      text("version", format(t.version, { installed:status.installedVersion, bundled:status.bundledVersion }));
      const runtime = status.nodeSource === "system" ? t.systemNode : status.nodeSource === "ulanzi" ? t.ulanziNode : t.unknownNode;
      text("currentNodeRuntime", format(t.currentNode, { runtime, version:status.nodeVersion }));
    }
    function lockModelSettings() {
      settingsReady = false;
      document.getElementById("model").disabled = true;
      document.getElementById("effort").disabled = true;
      const preset = document.getElementById("presetOption");
      if (preset) preset.disabled = true;
      if (modelPreset) text("modelError", t.modelLoading);
    }
    function validModel(value) {
      return typeof value === "string" && value.length <= 100 && /^[\p{L}\p{N}\p{M} ._+()/:\-]*$/u.test(value);
    }
    function validateModelSettings() {
      const model = document.getElementById("model");
      const effort = document.getElementById("effort");
      const modelError = validModel(model.value) ? "" : t.modelInvalid;
      const effortError = efforts.includes(effort.value) ? "" : t.effortInvalid;
      model.setCustomValidity(modelError); effort.setCustomValidity(effortError);
      text("modelError", modelError || effortError);
      return !modelError && !effortError;
    }
    function receiveModelSettings(message) {
      if (!modelPreset || socket?.readyState !== WebSocket.OPEN) return;
      // Studio may omit context fields on a PI-scoped reply. Reject any supplied mismatch.
      if (["uuid", "actionid", "key"].some(key => message[key] != null && String(message[key]) !== connection[key])) return;
      const settings = message.cmd === "didReceiveSettings" ? message.settings : message.param;
      if (!settings || typeof settings !== "object" || Array.isArray(settings)) return;
      actionSettings = message.cmd === "didReceiveSettings" ? { ...settings } : { ...actionSettings, ...settings };
      const model = document.getElementById("model"); const effort = document.getElementById("effort");
      model.value = typeof actionSettings.model === "string" ? actionSettings.model : "";
      effort.value = typeof actionSettings.effort === "string" ? actionSettings.effort : "";
      // An unknown select value becomes "" in the DOM: mark it invalid, never silently default it.
      const invalidEffort = actionSettings.effort != null && !efforts.includes(actionSettings.effort);
      const invalidModel = actionSettings.model != null && !validModel(actionSettings.model);
      settingsReady = true; model.disabled = false; effort.disabled = false;
      const preset = document.getElementById("presetOption");
      if (preset) preset.disabled = false;
      validateModelSettings();
      syncPresetOption(model.value || modelPreset.model, effort.value || (isFlashModel(model.value) ? "medium" : modelPreset.effort));
      updateEffortState();
      if (invalidModel || invalidEffort) {
        model.setCustomValidity(invalidModel ? t.modelInvalid : "");
        effort.setCustomValidity(invalidEffort ? t.effortInvalid : "");
        text("modelError", invalidModel ? t.modelInvalid : t.effortInvalid);
      }
    }
    function saveModelSetting(event) {
      if (!modelPreset || !settingsReady || socket?.readyState !== WebSocket.OPEN || event.isComposing) return;
      const model = document.getElementById("model"); const effort = document.getElementById("effort");
      // Validate both stored fields too, so editing one cannot erase an invalid restored other field.
      const candidate = { ...actionSettings, [event.target.id]:event.target.value };
      if (isSingleEffortModel(candidate.model)) candidate.effort = "high";
      if (!validModel(candidate.model ?? "") || !efforts.includes(candidate.effort ?? "")) {
        text("modelError", !validModel(candidate.model ?? "") ? t.modelInvalid : t.effortInvalid);
        return;
      }
      if (!validateModelSettings()) return;
      actionSettings = { ...candidate, model:model.value.trim(), effort:effort.value };
      model.value = actionSettings.model;
      syncPresetOption(actionSettings.model, actionSettings.effort);
      updateEffortState();
      sendGlobalSettings("setSettings", actionSettings);
    }
    function onPresetChange(event) {
      if (!modelPreset || !settingsReady || socket?.readyState !== WebSocket.OPEN) return;
      const value = event.target.value;
      if (!value) return;
      const [targetModel, targetEffort] = value.split(":");
      const model = document.getElementById("model");
      const effort = document.getElementById("effort");
      model.value = targetModel;
      effort.value = targetEffort;
      if (!validateModelSettings()) return;
      actionSettings = { ...actionSettings, model: targetModel, effort: targetEffort };
      syncPresetOption(targetModel, targetEffort);
      updateEffortState();
      sendGlobalSettings("setSettings", actionSettings);
    }
    function connect() {
      lockModelSettings();
      socket = new WebSocket(`ws://${connection.address}:${connection.port}`);
      socket.addEventListener("open", () => { socket.send(JSON.stringify({ code:0, cmd:"connected", uuid:connection.uuid })); sendGlobalSettings("getGlobalSettings"); if (modelPreset) sendGlobalSettings("getSettings"); send("status"); clearInterval(pollTimer); pollTimer = setInterval(() => send("status"), 2000); });
      socket.addEventListener("message", event => {
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        if (!message || typeof message !== "object") return;
        if (["didReceiveSettings", "add", "paramfromapp"].includes(message.cmd)) receiveModelSettings(message);
        if (message.cmd === "sendToPropertyInspector" && message.payload?.type === "bridgeSetupStatus") render(message.payload.status, message.payload);
        if (message.cmd === "didReceiveGlobalSettings") document.getElementById("forceFocus").checked = message.settings?.forceFocus === true;
      });
      socket.addEventListener("close", () => { lockModelSettings(); actionSettings = {}; clearInterval(pollTimer); setTimeout(connect, 1000); });
    }
    async function start() {
      await loadLocalizedResources();
      document.getElementById("modelSettings").hidden = !modelPreset;
      if (modelPreset) {
        for (const id of ["modelSettingsTitle", "presetLabel", "presetHelp", "modelLabel", "effortLabel", "modelHelp", "effortHelp"]) if (t[id]) text(id, t[id]);
        if (t.presetCustom) text("presetCustom", t.presetCustom);
        text("effortDefault", `${t.effortDefault} (${modelPreset.effort})`);
        text("modelDefaults", format(t.modelDefaults, { model:modelPreset.label, id:modelPreset.model, effort:modelPreset.effort }));
        document.getElementById("model").placeholder = modelPreset.label;
        document.getElementById("presetOption").addEventListener("change", onPresetChange);
        document.getElementById("model").addEventListener("change", saveModelSetting);
        document.getElementById("effort").addEventListener("change", saveModelSetting);
      }
      for (const [id, key] of [["title","title"],["intro","intro"],["appLabel","app"],["serviceLabel","service"],["cdpLabel","cdp"],["bridgeAppInfoTitle","bridgeAppInfoTitle"],["bridgeAppDescription","bridgeAppDescription"],["bridgeAppSafety","bridgeAppSafety"],["backgroundTitle","backgroundTitle"],["launchAgentDescription","launchAgentDescription"],["nodeSelectionStrategy","nodeSelectionStrategy"],["ulanziNodeSignatureNotice","ulanziNodeSignatureNotice"],["forceFocusLabel","forceFocus"],["forceFocusDescription","forceFocusDescription"],["install","install"],["launch","launch"],["uninstall","uninstall"],["refresh","refresh"],["guide","guide"],["message","checking"]]) text(id, t[key]);
      setValue("appValue", t.checking); setValue("serviceValue", t.checking); setValue("cdpValue", t.checking);
      document.getElementById("install").addEventListener("click", () => { if (confirm(t.confirm)) send("install"); });
      document.getElementById("launch").addEventListener("click", () => send("launch"));
      document.getElementById("uninstall").addEventListener("click", () => { if (confirm(t.uninstallConfirm)) send("uninstall"); });
      document.getElementById("forceFocus").addEventListener("change", event => sendGlobalSettings("setGlobalSettings", { forceFocus:Boolean(event.target.checked) }));
      document.getElementById("refresh").addEventListener("click", () => send("status")); document.getElementById("guide").addEventListener("click", () => send("openGuide")); connect();
    }
    void start();
  </script>
</body>
</html>
