<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Bridge Setup</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; background: transparent; color: #e8e8e8; font-size: 13px; }
    * { box-sizing: border-box; }
    main { padding: 12px 14px 10px; }
    h1 { margin: 0 0 5px; font-size: 15px; }
    .intro, .message, .info-body { color: #aeb3ba; line-height: 1.4; }
    .intro { margin: 0 0 10px; }
    .panel, details { border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: rgba(255,255,255,.035); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .row:last-child { border-bottom: 0; }
    .value { display: inline-flex; align-items: center; gap: 6px; text-align: right; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #72777f; }
    .good { color: #75d6a3; } .good .dot { background: #42c985; }
    .warn { color: #f0bc68; } .warn .dot { background: #e6a84b; }
    .bad, .error { color: #ef8585; } .bad .dot { background: #e45f5f; }
    .success { color: #75d6a3; }
    .message { min-height: 18px; margin: 8px 1px 4px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    button { min-height: 33px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; color: #f3f3f3; background: rgba(255,255,255,.08); cursor: pointer; }
    button.primary { background: #2867ad; } button.danger { grid-column: 1 / -1; color: #ef9a9a; }
    button:disabled { opacity: .45; cursor: default; }
    details { margin-top: 10px; } summary { padding: 9px 10px; cursor: pointer; font-weight: 600; }
    .info-body { padding: 0 10px 10px; }
    .info-body code { display: block; margin: 7px 0; padding: 7px 8px; border-radius: 5px; background: rgba(0,0,0,.28); user-select: text; }
    .version { margin-top: 7px; color: #777e87; font-size: 11px; text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="intro" class="intro"></p>
    <section class="panel">
      <div class="row"><span id="appLabel"></span><span id="appValue" class="value"><i class="dot"></i><span></span></span></div>
      <div class="row"><span id="serviceLabel"></span><span id="serviceValue" class="value"><i class="dot"></i><span></span></span></div>
      <div class="row"><span id="cdpLabel"></span><span id="cdpValue" class="value"><i class="dot"></i><span></span></span></div>
    </section>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="install" class="primary">Install / Repair</button>
      <button id="launch"></button>
      <button id="refresh"></button>
      <button id="guide"></button>
      <button id="uninstall" class="danger"></button>
    </div>
    <details>
      <summary id="bridgeAppInfoTitle"></summary>
      <div class="info-body">
        <p id="bridgeAppDescription"></p>
        <code>--remote-debugging-address=127.0.0.1<br>--remote-debugging-port=9222<br>--remote-allow-origins=http://127.0.0.1:9222</code>
        <p id="bridgeAppSafety"></p>
      </div>
    </details>
    <details>
      <summary id="backgroundTitle"></summary>
      <div class="info-body">
        <p id="launchAgentDescription"></p>
        <p id="nodeSelectionStrategy"></p>
        <p id="ulanziNodeSignatureNotice"></p>
        <p id="currentNodeRuntime"></p>
      </div>
    </details>
    <div id="version" class="version"></div>
  </main>
  <script>
    const t = {
      title:"Codex Bridge Setup", intro:"Install, launch, and check the local Codex connection.",
      app:"Codex Bridge", service:"Bridge service", cdp:"CDP connection", checking:"Checking…",
      installed:"Installed", update:"Update available", notInstalled:"Not installed", online:"Online",
      offline:"Offline", connected:"Connected", disconnected:"Disconnected", install:"Install / Repair",
      installing:"Installing…", launch:"Launch Codex Bridge", launching:"Launching…", uninstall:"Uninstall Codex Bridge",
      uninstalling:"Uninstalling…", refresh:"Check again", guide:"Installation guide", ready:"Codex Micro is ready.",
      needInstall:"Install Codex Bridge to continue.", needLaunch:"Start Codex through Codex Bridge.",
      serviceOffline:"The Bridge service is offline. Use Install / Repair.", installDone:"Codex Bridge was installed.",
      launchDone:"Launch requested. Waiting for CDP…", uninstallDone:"Codex Bridge was uninstalled.",
      failed:"Operation failed", unsupported:"Automatic installation is available on Windows and macOS only.",
      confirm:"Install or repair Codex Bridge in your user data directory?",
      uninstallConfirm:"Uninstall Codex Bridge and its user-level service? Codex Desktop and the Ulanzi plugin are kept.",
      bridgeAppInfoTitle:"How does Codex Bridge start Codex?",
      bridgeAppDescription:"Windows dynamically discovers Codex Stable or Beta. macOS uses the local wrapper. Both launch the official executable with loopback-only CDP arguments.",
      bridgeAppSafety:"The launcher does not modify accounts, projects, or user files. Bridge write actions require a local capability token.",
      backgroundTitle:"Background activity and Node.js",
      launchAgentDescription:"Windows uses a plugin-supervised user process; macOS uses a user LaunchAgent. Neither installs an administrator service.",
      nodeSelectionStrategy:"Install / Repair selects Node.js 20+ from PATH, then uses Ulanzi Studio Node as a fallback.",
      ulanziNodeSignatureNotice:"Bridge and CDP listen only on loopback addresses.",
      currentNode:"Current runtime: {runtime} {version}", systemNode:"System Node.js",
      ulanziNode:"Ulanzi Studio Node", unknownNode:"Not installed or not recorded", version:"Installed {installed} · Bundled {bundled}"
    };
    const query = new URLSearchParams(location.search);
    const rawLanguage = query.get("language") || "en-US";
    const locale = rawLanguage.startsWith("zh-HK") || rawLanguage.startsWith("zh-TW") ? "zh_HK" : rawLanguage.startsWith("zh") ? "zh_CN" : rawLanguage.split(/[-_]/)[0];
    const resource = { en:"en", zh_CN:"zh_CN", zh_HK:"zh_HK", ja:"ja_JP", de:"de_DE", ko:"ko_KR", pt:"pt_PT", es:"es_ES" }[locale] || "en";
    const connection = { address:query.get("address") || "127.0.0.1", port:query.get("port") || "3906", uuid:query.get("uuid") || "com.ulanzi.ulanzistudio.codexmicro.task1", actionid:query.get("actionid") || "", key:query.get("key") || "" };
    let socket; let busy = false; let pollTimer;

    async function loadLocalizedResources() {
      try {
        const localized = (await (await fetch(`../${resource}.json`)).json()).Localization || {};
        const fields = { BridgeSetup:"title", BridgeSetupDescription:"intro", BridgeApp:"app", BridgeService:"service", CDPConnection:"cdp", InstallRepair:"install", LaunchBridge:"launch", UninstallBridge:"uninstall", UninstallingBridge:"uninstalling", UninstallBridgeDone:"uninstallDone", UninstallBridgeConfirm:"uninstallConfirm", BridgeAppInfoTitle:"bridgeAppInfoTitle", BridgeAppDescription:"bridgeAppDescription", BridgeAppSafety:"bridgeAppSafety", BackgroundActivityTitle:"backgroundTitle", LaunchAgentDescription:"launchAgentDescription", NodeSelectionStrategy:"nodeSelectionStrategy", UlanziNodeSignatureNotice:"ulanziNodeSignatureNotice", CurrentNodeRuntime:"currentNode", SystemNode:"systemNode", UlanziNode:"ulanziNode", UnknownNode:"unknownNode", CheckAgain:"refresh", InstallationGuide:"guide" };
        for (const [source, target] of Object.entries(fields)) if (localized[source]) t[target] = localized[source];
      } catch {}
    }
    function text(id, value) { document.getElementById(id).textContent = value; }
    function format(template, values) { return template.replace(/\{(\w+)\}/g, (_, key) => values[key] || "—"); }
    function setValue(id, value, level = "") { const element = document.getElementById(id); element.className = `value ${level}`; element.querySelector("span").textContent = value; }
    function send(action) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ cmd:"sendToPlugin", uuid:connection.uuid, actionid:connection.actionid, key:connection.key, payload:{ type:"bridgeSetup", action } })); }
    function render(status, payload = {}) {
      busy = Boolean(payload.busy);
      setValue("appValue", status.installed ? (status.needsUpdate ? t.update : t.installed) : t.notInstalled, status.installed ? (status.needsUpdate ? "warn" : "good") : "bad");
      setValue("serviceValue", status.serviceOnline ? t.online : t.offline, status.serviceOnline ? "good" : "bad");
      setValue("cdpValue", status.cdpConnected ? t.connected : t.disconnected, status.cdpConnected ? "good" : "warn");
      const install = document.getElementById("install"); const launch = document.getElementById("launch"); const uninstall = document.getElementById("uninstall");
      install.textContent = busy && payload.operation === "install" ? t.installing : t.install;
      launch.textContent = busy && payload.operation === "launch" ? t.launching : t.launch;
      uninstall.textContent = busy && payload.operation === "uninstall" ? t.uninstalling : t.uninstall;
      install.disabled = busy || !status.supported; launch.disabled = busy || !status.installed || status.cdpConnected; uninstall.disabled = busy || !status.supported || !status.installed;
      let message = !status.supported ? t.unsupported : !status.installed || status.needsUpdate ? t.needInstall : !status.serviceOnline ? t.serviceOffline : !status.cdpConnected ? t.needLaunch : t.ready;
      let level = status.cdpConnected && status.installed && !status.needsUpdate ? "success" : "";
      if (payload.result === "install") { message = t.installDone; level = "success"; }
      if (payload.result === "launch") { message = t.launchDone; level = "success"; }
      if (payload.result === "uninstall") { message = t.uninstallDone; level = "success"; }
      if (payload.error) { message = `${t.failed}: ${payload.error}`; level = "error"; }
      text("message", message); document.getElementById("message").className = `message ${level}`;
      text("version", format(t.version, { installed:status.installedVersion, bundled:status.bundledVersion }));
      const runtime = status.nodeSource === "system" ? t.systemNode : status.nodeSource === "ulanzi" ? t.ulanziNode : t.unknownNode;
      text("currentNodeRuntime", format(t.currentNode, { runtime, version:status.nodeVersion }));
    }
    function connect() {
      socket = new WebSocket(`ws://${connection.address}:${connection.port}`);
      socket.addEventListener("open", () => { socket.send(JSON.stringify({ code:0, cmd:"connected", uuid:connection.uuid })); send("status"); clearInterval(pollTimer); pollTimer = setInterval(() => send("status"), 2000); });
      socket.addEventListener("message", event => { const message = JSON.parse(event.data); if (message.cmd === "sendToPropertyInspector" && message.payload?.type === "bridgeSetupStatus") render(message.payload.status, message.payload); });
      socket.addEventListener("close", () => { clearInterval(pollTimer); setTimeout(connect, 1000); });
    }
    async function start() {
      await loadLocalizedResources();
      for (const [id, key] of [["title","title"],["intro","intro"],["appLabel","app"],["serviceLabel","service"],["cdpLabel","cdp"],["bridgeAppInfoTitle","bridgeAppInfoTitle"],["bridgeAppDescription","bridgeAppDescription"],["bridgeAppSafety","bridgeAppSafety"],["backgroundTitle","backgroundTitle"],["launchAgentDescription","launchAgentDescription"],["nodeSelectionStrategy","nodeSelectionStrategy"],["ulanziNodeSignatureNotice","ulanziNodeSignatureNotice"],["install","install"],["launch","launch"],["uninstall","uninstall"],["refresh","refresh"],["guide","guide"],["message","checking"]]) text(id, t[key]);
      setValue("appValue", t.checking); setValue("serviceValue", t.checking); setValue("cdpValue", t.checking);
      document.getElementById("install").addEventListener("click", () => { if (confirm(t.confirm)) send("install"); });
      document.getElementById("launch").addEventListener("click", () => send("launch"));
      document.getElementById("uninstall").addEventListener("click", () => { if (confirm(t.uninstallConfirm)) send("uninstall"); });
      document.getElementById("refresh").addEventListener("click", () => send("status")); document.getElementById("guide").addEventListener("click", () => send("openGuide")); connect();
    }
    void start();
  </script>
</body>
</html>
